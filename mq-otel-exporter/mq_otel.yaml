global:
  useObjectStatus: true
  useResetQStats: false
  usePublications: false
  useStatistics: false
  logLevel: INFO
  # Leave metaprefix empty when usePublications is false — a non-empty value
  # still runs publication metadata discovery and mq_otel fatals after 30s (2033).
  metaprefix: ""
  pollInterval: 15s
  rediscoverInterval: 1h
  tzOffset: 0h

connection:
  queueManager: QM1
  clientConnection: false
  replyQueue: MQOTEL.REPLY
  replyQueue2: MQOTEL.REPLY2
  waitInterval: 120

objects:
  queues:
    - ORDER.REQ
    - ORDER.RESP

filters:
  hideSvrConnJobname: false
  showInactiveChannels: false
  queueSubscriptionSelector:
    - PUT
    - GET
    - GENERAL

otel:
  endpoint: otel-collector:4317
  insecure: true
  logLevel: INFO
  interval: 15s
  maxErrors: 100
