global:
  useObjectStatus: true
  useResetQStats: false
  usePublications: true
  useStatistics: false
  logLevel: INFO
  metaprefix: ibmmq
  pollInterval: 15s
  rediscoverInterval: 1h
  tzOffset: 0h

connection:
  queueManager: QM1
  connName: mq(1414)
  channel: DEV.APP.SVRCONN
  clientConnection: true
  user: app
  passwordFile: /run/secrets/mqAppPassword
  replyQueue: SYSTEM.DEFAULT.MODEL.QUEUE
  waitInterval: 5

objects:
  queues:
    - DEV.QUEUE.*
    - ORDER.*
    - "!SYSTEM.*"
    - "!AMQ.*"
  channels:
    - DEV.*
    - ORDERS.*

filters:
  hideSvrConnJobname: false
  showInactiveChannels: false
  queueSubscriptionSelector:
    - PUT
    - GET
    - GENERAL

otel:
  endpoint: otel-collector:4317
  insecure: true
  logLevel: INFO
  interval: 15s
  maxErrors: 10
